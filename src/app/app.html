<main class="main">
  <div class="floating-bar">
    <img [src]="nightThemePath" alt="Theme image" class="theme-image" (click)="changeColorTheme()">  
    <a class="lang-checkbox" (click)="switchLang()">
      {{nextLang}}
    </a>
    <a class="skills-btn" href="#skills">Skills</a>
    <a class="projects-btn" href="#projects">Projects</a>
    <a class="career-btn" href="#career">Career</a>
    <a class="contact-btn" href="#contact">Contact</a>
  </div>
  <div class="content-wrapper">
    <app-landing id="landing"></app-landing> 
    <app-skills id="skills"></app-skills>
    <app-projects id="projects"></app-projects>
    <app-career-history id="career"></app-career-history>
    <app-contact id="contact"></app-contact>
  </div>
  <div class="go-to-top" (click)="scrollToTop()" [class.visible]="showGoToTopBtn">
    <img [src]="topArrowPath" alt="Go to top" class="arrow">
  </div>
  <footer>
    <app-footer></app-footer>
  </footer>
</main>  
<router-outlet />
