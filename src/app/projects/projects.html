<div class="content">
    @for(project of this.projects; track project){
        <div class="project-card">
            <h2>{{ project.title }}</h2>
            <p class="link">
                <a [href]="project.link" target="_blank">
                    @if(project.link != null){
                        Voir le projet
                    }@else {
                        Privé
                    }
                </a>
            </p>
            <p class="description">{{ project.description }}</p>
        </div>
    }
</div>
