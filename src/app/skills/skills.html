<div class="content">
    <section class="languages">
        <div class="lang-sliders">
            <span class="french slider">
                <div class="range-slider">
                    <h3 class="label">Français</h3>

                    <div class="track">
                        <div class="fill"></div>
                        <div class="thumb"></div>
                    </div>
                </div>
            </span>
            <span class="english slider">
                <div class="range-slider">
                    <h3 class="label">Anglais</h3>
                    <div class="track">
                        <div class="fill"></div>
                        <div class="thumb"></div>
                    </div>
                </div>
            </span>
            <span class="spanish slider">
                <div class="range-slider">
                    <h3 class="label">Espagnol</h3>
                    <div class="track">
                        <div class="fill"></div>
                        <div class="thumb"></div>
                    </div>
                </div>
            </span>
            <span class="japanese slider">
                <div class="range-slider">
                    <h3 class="label">Japonais</h3>
                    <div class="track">
                        <div class="fill"></div>
                        <div class="thumb"></div>
                    </div>
                </div>
            </span>
        </div>
    </section>
    <section class="programming">
        <div class="carousel-container">
            <button class="nav-btn" (click)="prev()" [style.visibility]="currentIndex > 0 ? 'visible' : 'hidden'">
                ‹
            </button>
            <div class="carousel">
                <div class="carousel-track" [style.transform]="'translateX(-' + currentIndex * (100 / visibleCards) + '%)'">
                @for (skill of skills; track skill.name) {
                    <div class="card">
                        <img class="icon" [src]="skill.icon">
                        <h3>{{ skill.name }}</h3>
                        <p>{{ skill.text }}</p>
                    </div>
                }
                </div>
            </div>
            <button class="nav-btn" (click)="next()" [style.visibility]="currentIndex >= 5 ? 'hidden' : 'visible'">
                ›
            </button>
        </div>
    </section>
</div>
